name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-static.py

  rust-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      # Default features only, deliberately: the optional `tpm2` feature needs
      # libtss2-dev, which this job doesn't install - see the rust-tpm2 job.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo build --release
      - name: Software qualification matrix
        env:
          DA_QUALIFY_FAST: "1"
          # Emulator rows are claimed by the dedicated emulator-* jobs.
          DA_EMULATOR_VCAN: "1"
          DA_EMULATOR_SWTPM: "1"
          DA_EMULATOR_V4L2: "skip"
          DA_ARM64_PACKAGES: "1"
        run: make qualify
      - uses: actions/upload-artifact@v4
        with: {name: qualification-matrix, path: evidence/qualification/software-matrix.json}
      # `hotplug` is pure Rust (netlink-sys, no system library), so unlike
      # tpm2 it can just piggyback on this job instead of needing its own.
      - run: cargo clippy --all-targets --features hotplug -- -D warnings
      - run: cargo test --all --features hotplug
      - run: cargo build --release --features hotplug

  rust-tpm2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libtss2-dev
      - run: cargo clippy --all-targets --features tpm2 -- -D warnings
      - run: cargo test --all --features tpm2
      - run: cargo build --release --features tpm2

  rust-camera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # v4l's default backing crate (v4l2-sys*) bindgens the kernel's V4L2
      # uapi headers at build time - needs libclang, unlike the rest of this
      # codebase's dependencies. `jpeg-encoder` (the other half of `camera`)
      # is pure Rust and needs nothing extra.
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - run: cargo clippy --all-targets --features camera -- -D warnings
      - run: cargo test --all --features camera
      - run: cargo build --release --features camera

  emulator-vcan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y iproute2 can-utils curl "linux-modules-extra-$(uname -r)"
      - name: vcan capture smoke
        env:
          DA_EMULATOR_STRICT: "1"
        run: |
          chmod +x scripts/emulator/*.sh
          ./scripts/emulator/smoke-vcan.sh

  emulator-swtpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libtss2-dev swtpm swtpm-tools tpm2-tools pkg-config
      - name: swtpm identity smoke
        env:
          DA_EMULATOR_STRICT: "1"
        run: |
          chmod +x scripts/emulator/*.sh
          ./scripts/emulator/smoke-swtpm.sh

  emulator-v4l2:
    runs-on: ubuntu-latest
    # Soft-skip when the runner kernel has no matching v4l2loopback module.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev ffmpeg v4l2loopback-dkms linux-headers-$(uname -r) curl file xxd || true
      - name: v4l2loopback camera smoke
        env:
          DA_EMULATOR_STRICT: "0"
        run: |
          chmod +x scripts/emulator/*.sh
          ./scripts/emulator/smoke-v4l2.sh

  hil-ci-emulator:
    # Lab substitute when Minewing silicon is unavailable: HIL harness vs
    # vcan emulator agent. Never claimable as physical Minewing.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y iproute2 can-utils curl "linux-modules-extra-$(uname -r)"
      - name: CI emulator HIL
        env:
          DA_EMULATOR_STRICT: "1"
        run: |
          chmod +x scripts/ci/run-hil-emulator.sh scripts/emulator/*.sh scripts/hil/*.sh
          ./scripts/ci/run-hil-emulator.sh
      - uses: actions/upload-artifact@v4
        with:
          name: qualification-ci-hil-emulator
          path: evidence/qualification/ci/
          if-no-files-found: error

  rust-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
      - run: cargo check --target aarch64-unknown-linux-gnu --all-targets
      - run: cargo build --release --target aarch64-unknown-linux-gnu

  packages-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cd web/dashboard && npm install --no-audit --no-fund && npm run build
      - run: cargo build --release
      - run: sudo apt-get update && sudo apt-get install -y dpkg-dev binutils file rpm || sudo apt-get install -y dpkg-dev binutils file
      - run: chmod +x scripts/package-deb-rpm.sh scripts/package.sh
      - run: ./scripts/package-deb-rpm.sh
      - run: VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1) ARCH=linux-amd64 ./scripts/package.sh
      - run: ls -la dist && dpkg-deb -I dist/*.deb | head -40

  packages-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cd web/dashboard && npm install --no-audit --no-fund && npm run build
      - run: cargo build --release
      - run: sudo apt-get update && sudo apt-get install -y dpkg-dev binutils file rpm || sudo apt-get install -y dpkg-dev binutils file
      - run: chmod +x scripts/package-deb-rpm.sh scripts/package.sh
      - run: ./scripts/package-deb-rpm.sh
      - run: VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1) ARCH=linux-arm64 ./scripts/package.sh
      - run: ls -la dist && dpkg-deb -I dist/*.deb | head -40
      - name: Confirm aarch64 package payload
        run: |
          dpkg-deb -x dist/*.deb /tmp/da-arm64
          file /tmp/da-arm64/usr/bin/zyvor-device-agent | grep -Ei 'aarch64|ARM aarch64|ARM64'

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  container:
    needs: [static, rust-native, rust-arm64, rust-tpm2, rust-camera, emulator-vcan, emulator-swtpm, hil-ci-emulator, packages-amd64, packages-arm64, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 image
        run: docker buildx build --platform linux/amd64 -t zyvor-device-agent:amd64 --load .
      - name: Build arm64 image
        run: docker buildx build --platform linux/arm64 -t zyvor-device-agent:arm64 --load .
      - name: Smoke test amd64 image
        run: |
          # ENTRYPOINT is already /usr/bin/zyvor-device-agent - args here are its CLI args,
          # not another invocation of the binary.
          docker run --rm zyvor-device-agent:amd64 --version
          # doctor exits non-zero on any failing hardware check, which is expected in a
          # container with no real GPIO/I2C/CAN hardware — assert the process runs and
          # emits valid JSON, not that every check passes.
          docker run --rm zyvor-device-agent:amd64 doctor > doctor-amd64.json || true
          python3 -m json.tool < doctor-amd64.json > /dev/null
      - name: Smoke test arm64 image under QEMU
        run: |
          docker run --rm --platform linux/arm64 zyvor-device-agent:arm64 --version
          docker run --rm --platform linux/arm64 zyvor-device-agent:arm64 doctor > doctor-arm64.json || true
          python3 -m json.tool < doctor-arm64.json > /dev/null
