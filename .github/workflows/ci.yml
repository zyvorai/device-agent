name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-static.py

  rust-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo clippy --all-targets
      - run: cargo test --all
      - run: cargo build --release

  rust-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
      - run: cargo check --target aarch64-unknown-linux-gnu --all-targets
      - run: cargo build --release --target aarch64-unknown-linux-gnu

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  container:
    needs: [static, rust-native, rust-arm64, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 image
        run: docker buildx build --platform linux/amd64 -t zyvor-device-agent:amd64 --load .
      - name: Build arm64 image
        run: docker buildx build --platform linux/arm64 -t zyvor-device-agent:arm64 --load .
      - name: Smoke test amd64 image
        run: |
          docker run --rm zyvor-device-agent:amd64 /usr/bin/zyvor-device-agent --version
          # doctor exits non-zero on any failing hardware check, which is expected in a
          # container with no real GPIO/I2C/CAN hardware — assert the process runs and
          # emits valid JSON, not that every check passes.
          docker run --rm zyvor-device-agent:amd64 /usr/bin/zyvor-device-agent doctor > doctor-amd64.json || true
          python3 -m json.tool < doctor-amd64.json > /dev/null
      - name: Smoke test arm64 image under QEMU
        run: |
          docker run --rm --platform linux/arm64 zyvor-device-agent:arm64 /usr/bin/zyvor-device-agent --version
          docker run --rm --platform linux/arm64 zyvor-device-agent:arm64 /usr/bin/zyvor-device-agent doctor > doctor-arm64.json || true
          python3 -m json.tool < doctor-arm64.json > /dev/null
