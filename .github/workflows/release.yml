name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: python3 scripts/check-static.py
      - run: cd web/dashboard && npm install --no-audit --no-fund && npm test && npm run build
      - run: cargo test --all && cargo build --release
      - name: Build .deb/.rpm (amd64 only for now)
        # cargo-deb/cargo-generate-rpm are metadata-driven from
        # [package.metadata.deb]/[package.metadata.generate-rpm] in Cargo.toml,
        # so there's no separate packaging manifest to keep in sync. arm64
        # cross-packaging isn't validated yet (see docs/BACKLOG.md) - amd64
        # only until that's confirmed, rather than blocking this milestone on it.
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          cargo deb -o dist/
          cargo generate-rpm -o dist/
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
      - run: cargo build --release --target aarch64-unknown-linux-gnu
      - name: Package amd64
        run: |
          VERSION="${GITHUB_REF_NAME#v}" ARCH=linux-amd64 ./scripts/package.sh
      - name: Package arm64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="dist/zyvor-device-agent-${VERSION}-linux-arm64"
          mkdir -p "$OUT/bin" "$OUT/config" "$OUT/systemd" "$OUT/dashboard" "$OUT/profiles" "$OUT/plugins" "$OUT/plugins.d"
          cp target/aarch64-unknown-linux-gnu/release/zyvor-device-agent "$OUT/bin/"
          cp config/device-agent.example.toml "$OUT/config/device-agent.toml"
          cp packaging/systemd/zyvor-device-agent.service "$OUT/systemd/"
          cp profiles/*.toml "$OUT/profiles/"
          cp examples/i2c_temperature.py "$OUT/plugins/"
          cp examples/plugins.d/i2c-temperature.json "$OUT/plugins.d/"
          cp -r web/dashboard/dist/. "$OUT/dashboard/"
          tar -C dist -czf "${OUT}.tar.gz" "$(basename "$OUT")"
      - name: Checksums
        run: sha256sum dist/*.tar.gz dist/*.deb dist/*.rpm > dist/SHA256SUMS
      - name: Generate Rust SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json
          mv *.cdx.json dist/sbom-rust.cdx.json
      - name: Generate dashboard SBOM
        run: |
          cd web/dashboard
          npm sbom --sbom-format cyclonedx > ../../dist/sbom-dashboard.cdx.json
      - uses: sigstore/cosign-installer@v3
      - name: Sign checksums and SBOMs (keyless, GitHub OIDC)
        run: |
          cosign sign-blob --yes dist/SHA256SUMS \
            --output-signature dist/SHA256SUMS.sig --output-certificate dist/SHA256SUMS.pem
          cosign sign-blob --yes dist/sbom-rust.cdx.json \
            --output-signature dist/sbom-rust.cdx.json.sig --output-certificate dist/sbom-rust.cdx.json.pem
          cosign sign-blob --yes dist/sbom-dashboard.cdx.json \
            --output-signature dist/sbom-dashboard.cdx.json.sig --output-certificate dist/sbom-dashboard.cdx.json.pem
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/*.tar.gz,dist/*.deb,dist/*.rpm'
      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Matches "## X.Y.Z ..." or "## X.Y.Z-dev ..." (this repo bundles a
          # release's changes under a single "-dev" heading until it ships) up
          # to the next "## " heading.
          NOTES=$(awk -v ver="$VERSION" '
            /^## / {
              if (found) exit
              line = $0
              sub(/^## /, "", line)
              split(line, parts, " ")
              heading_ver = parts[1]
              sub(/-dev$/, "", heading_ver)
              if (heading_ver == ver) { found = 1 }
              next
            }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::warning::No CHANGELOG.md section matched version $VERSION; falling back to the top section"
            NOTES=$(awk '/^## /{if(found) exit; found=1; next} found{print}' CHANGELOG.md)
          fi
          {
            echo "notes<<ZYVOR_CHANGELOG_EOF"
            echo "$NOTES"
            echo "ZYVOR_CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pem
            dist/sbom-*.cdx.json
            dist/sbom-*.cdx.json.sig
            dist/sbom-*.cdx.json.pem
