[package]
name = "zyvor-device-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Linux hardware edge agent for Zyvor — inventory, physical buses, health, sensors, Nodra and Fleet integration."
license = "Apache-2.0"
homepage = "https://zyvor.dev"
repository = "https://github.com/zyvorai/device-agent"
readme = "README.md"
keywords = ["edge", "iot", "arm64", "hardware", "zyvor"]
categories = ["hardware-support", "network-programming"]

[[bin]]
name = "zyvor-device-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "macros"] }
clap = { version = "4.5", features = ["derive", "env"] }
rumqttc = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
