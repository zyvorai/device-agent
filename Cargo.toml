[package]
name = "zyvor-device-agent"
version = "0.1.4"
edition = "2021"
rust-version = "1.85"
description = "Linux hardware edge agent for Zyvor — inventory, physical buses, health, sensors, Nodra and Fleet integration."
license = "Apache-2.0"
homepage = "https://zyvor.dev"
repository = "https://github.com/zyvorai/device-agent"
readme = "README.md"
keywords = ["edge", "iot", "arm64", "hardware", "zyvor"]
categories = ["hardware-support", "network-programming"]

[[bin]]
name = "zyvor-device-agent"
path = "src/main.rs"

# Off by default: must never affect a plain `cargo build`. tss-esapi needs
# libtss2-dev at build time (via pkg-config) - fine for CI's dedicated
# `--features tpm2` leg, not something to impose on every build. `hotplug`
# is off by default too: it's a pure accelerant on top of the existing
# polling refresh, and the rest of this codebase has no runtime-library
# footprint (netlink-sys is pure Rust/libc, unlike udev/libudev.so) worth
# giving up just for this.
[features]
tpm2 = ["dep:tss-esapi"]
hotplug = ["dep:netlink-sys"]

[dependencies]
anyhow = "1.0"
arc-swap = "1.9"
axum = { version = "0.8", features = ["json", "macros"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
clap = { version = "4.5", features = ["derive", "env"] }
libc = "0.2"
netlink-sys = { version = "0.9.0", features = ["tokio_socket"], optional = true }
nix = { version = "0.29", features = ["process", "user"] }
rcgen = "0.14.7"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rumqttc = "0.25"
rustix = { version = "0.38", features = ["process"] }
rustls = "0.23.44"
rustls-pemfile = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
subtle = "2.6"
tokio = { version = "1.43", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["trace", "fs", "cors"] }
tower_governor = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tss-esapi = { version = "7.7", optional = true }
x509-parser = "0.18.1"

# Linux-only: seccompiler's own libc bindings (SECCOMP_RET_*, prctl PR_SET_NO_NEW_PRIVS,
# SYS_seccomp) simply don't exist in the libc crate on other platforms - not just unused,
# an actual compile failure - so this must stay out of the default dependency set entirely.
[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Asset list mirrors scripts/install.sh's layout so the .deb/.rpm and the
# manual tarball install end up with an identical on-disk footprint.
[package.metadata.deb]
maintainer = "Zyvor <support@zyvor.dev>"
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
    { source = "target/release/zyvor-device-agent", dest = "usr/bin/", mode = "755" },
    { source = "profiles/*.toml", dest = "etc/zyvor/device-agent/profiles/", mode = "644" },
    { source = "examples/i2c_temperature.py", dest = "usr/lib/zyvor-device-agent/plugins/i2c_temperature.py", mode = "755" },
    { source = "examples/plugins.d/i2c-temperature.json", dest = "etc/zyvor/device-agent/plugins.d/i2c-temperature.json", mode = "644" },
    # /etc is auto-detected as conffiles by dpkg, so a locally-modified
    # config survives an upgrade without needing a conf-files entry here.
    { source = "config/device-agent.example.toml", dest = "etc/zyvor/device-agent.toml", mode = "640" },
    { source = "web/dashboard/dist/index.html", dest = "usr/share/zyvor-device-agent/dashboard/index.html", mode = "644" },
    { source = "web/dashboard/dist/assets/*", dest = "usr/share/zyvor-device-agent/dashboard/assets/", mode = "644" },
]

# Installing the package must never auto-start a root-capable daemon -
# matches scripts/install.sh's explicit-step philosophy. `dpkg -i` installs
# the unit disabled and inactive; the operator runs `systemctl enable --now`
# after reviewing /etc/zyvor/device-agent.toml.
[package.metadata.deb.systemd-units]
unit-scripts = "packaging/systemd"
unit-name = "zyvor-device-agent"
enable = false
start = false

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/zyvor-device-agent", dest = "/usr/bin/zyvor-device-agent", mode = "755" },
    { source = "packaging/systemd/zyvor-device-agent.service", dest = "/usr/lib/systemd/system/zyvor-device-agent.service", mode = "644" },
    { source = "profiles/*.toml", dest = "/etc/zyvor/device-agent/profiles/", mode = "644" },
    { source = "examples/i2c_temperature.py", dest = "/usr/lib/zyvor-device-agent/plugins/i2c_temperature.py", mode = "755" },
    { source = "examples/plugins.d/i2c-temperature.json", dest = "/etc/zyvor/device-agent/plugins.d/i2c-temperature.json", mode = "644" },
    { source = "config/device-agent.example.toml", dest = "/etc/zyvor/device-agent.toml", mode = "640", config = "noreplace" },
    { source = "web/dashboard/dist/index.html", dest = "/usr/share/zyvor-device-agent/dashboard/index.html", mode = "644" },
    { source = "web/dashboard/dist/assets/*", dest = "/usr/share/zyvor-device-agent/dashboard/assets/", mode = "644" },
]
# cargo-generate-rpm has no systemd-units integration like cargo-deb's -
# reload the unit cache only, never enable/start, matching the .deb behavior.
post_install_script = "systemctl daemon-reload || true"
post_uninstall_script = "systemctl daemon-reload || true"
