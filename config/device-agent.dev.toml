[server]
listen = "127.0.0.1:9188"
dashboard_dir = "web/dashboard/dist"

[device]
vendor = "Development"
model = "Linux Workstation"
serial = "auto"
profile = "generic-linux-arm64"
profile_directory = "profiles"
telemetry_interval_seconds = 10
inventory_refresh_seconds = 5

[nodra]
enabled = false
broker = "127.0.0.1"
port = 1883
client_id = "zyvor-device-agent-dev"
topic_prefix = "zyvor/device"
retain_inventory = true

[fleet]
enabled = true
mode = "projection"

[plugins]
directory = "examples/plugins.d"
timeout_seconds = 3
sample_interval_seconds = 5
require_absolute_command = true
reject_world_writable = true
max_output_bytes = 262144
