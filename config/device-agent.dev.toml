[server]
listen = "127.0.0.1:9188"
dashboard_dir = "web/dashboard/dist"

[server.unix_socket]
enabled = false
path = "/tmp/zyvor-device-agent-dev.sock"
file_mode = 0o660
allow_uids = []
allow_gids = []

[server.cors]
enabled = false
allowed_origins = []

[server.rate_limit]
# Off in dev so a fast local dashboard/test loop never trips it.
enabled = false
requests_per_second = 20
burst = 40

[auth]
mode = "none"
exempt_paths = ["/api/v1/health", "/api/v1/ready"]

[auth.bearer]
token_hash_file = "/tmp/zyvor-device-agent-dev-bearer.sha256"

[device]
vendor = "Development"
model = "Linux Workstation"
serial = "auto"
profile = "generic-linux-arm64"
profile_directory = "profiles"
telemetry_interval_seconds = 10
inventory_refresh_seconds = 5

[industrial]
# Read-only SocketCAN enrichment. Set to "" to use sysfs-only discovery.
can_ip_command = "ip"
# Declare only ports wired/configured for RS485 on your board. No active serial probing is performed.
rs485_ports = []
publish_to_nodra = true

[industrial.can_capture]
# RX only. No transmit path exists. Explicitly allowlist interfaces to capture.
enabled = false
interfaces = []
history_limit = 512
max_frames_per_second = 200
include_error_frames = false
publish_to_nodra = true

[nodra]
enabled = false
broker = "127.0.0.1"
port = 1883
client_id = "zyvor-device-agent-dev"
topic_prefix = "zyvor/device"
retain_inventory = true

[fleet]
enabled = true
mode = "projection"

[plugins]
directory = "examples/plugins.d"
timeout_seconds = 3
sample_interval_seconds = 5
require_absolute_command = true
reject_world_writable = true
max_output_bytes = 262144
